<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siapkan Operator — SI-TAQWA</title>
<link rel="stylesheet" href="si-tema.css">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#edf7ff,#f8fbfe 48%,#e6f1fb);font-family:system-ui,sans-serif;color:var(--ink,#243b53)}
main{width:min(480px,100%);padding:clamp(22px,5vw,36px);background:#fff;border:1px solid #dbe8f2;border-radius:20px;box-shadow:0 12px 36px #102a4315}
h1{margin:0;color:var(--navy,#102a43);font-size:clamp(24px,6vw,32px)}
p{line-height:1.55}.mut{color:var(--mute,#627d98);font-size:14px}
label{display:block;margin:14px 0 6px;font-weight:700}
input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #cbd8e6;border-radius:10px;font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #1677c850;outline-offset:2px}
button{padding:12px 18px;border:0;border-radius:10px;background:var(--navy,#102a43);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.err{color:#a12720}.hasil{padding:14px;border-radius:12px;background:#eef6fc;overflow-wrap:anywhere}
.hasil b{display:inline-block;min-width:92px}
</style>
</head>
<body>
<main>
  <h1>Siapkan akun Operator</h1>
  <p class="mut">Gunakan PIN admin yang disimpan di Cloudflare sebagai <code>ADMIN_PIN</code>. Setup hanya dapat membuat satu akun Operator pertama kali.</p>
  <form id="form">
    <label for="nama">Nama Operator</label>
    <input id="nama" name="nama" autocomplete="name" maxlength="100" required>
    <label for="pin">PIN admin Cloudflare</label>
    <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
    <p><button id="submit" type="submit">Buat akun Operator</button></p>
  </form>
  <div id="pesan" class="mut" role="status" aria-live="polite"></div>
  <div id="hasil" class="hasil" hidden></div>
  <p><a href="kelas.html">Ke laman login Administrasi Guru dan Staf</a></p>
</main>
<script>
const form = document.getElementById('form');
const pesan = document.getElementById('pesan');
const hasil = document.getElementById('hasil');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const tombol = document.getElementById('submit');
  tombol.disabled = true;
  pesan.className = 'mut';
  pesan.textContent = 'Menyiapkan akun...';
  hasil.hidden = true;
  try {
    const r = await fetch('/api/bootstrap-operator', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nama: form.nama.value, pin: form.pin.value })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `Gagal menyiapkan akun (HTTP ${r.status}).`);
    form.hidden = true;
    form.pin.value = '';
    pesan.textContent = 'Simpan username dan PIN ini sekarang. Keduanya tidak akan ditampilkan lagi.';
    hasil.innerHTML = `<b>Username</b> ${esc(d.username)}<br><b>PIN login</b> ${esc(d.pin)}`;
    hasil.hidden = false;
  } catch (error) {
    pesan.className = 'err';
    pesan.textContent = error.message;
    tombol.disabled = false;
  }
});
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
