<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fasilitas Sekolah</title>
<link rel="icon" href="logo-at-taqwa.png">
<style>
:root{--navy:#102a43;--blue:#1677c8;--soft:#eef6fc;--ink:#243b53;--line:#cbd8e6;--mute:#627d98}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf7ff,#f8fbfe 48%,#e6f1fb)}
.wrap{flex:1;width:min(1000px,calc(100% - 24px));margin:0 auto;padding:24px 0 40px}
h1{margin:0;color:var(--navy);font-size:clamp(24px,5vw,32px);letter-spacing:-.03em}
h2{margin:28px 0 0;color:var(--navy);font-size:20px}
.mut{color:var(--mute);font-size:14px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.bar input{flex:1 1 220px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);font:inherit;background:#fff}
.bar input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px #1677c820}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips button{font:inherit;font-weight:700;font-size:14px;cursor:pointer;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--navy)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:14px}
.f{background:#fff;border:1px solid #dbe8f2;border-radius:18px;overflow:hidden;box-shadow:0 8px 24px #102a430d;cursor:pointer;text-align:left;padding:0;font:inherit;color:inherit;display:block;width:100%}
.f:hover{box-shadow:0 12px 30px #102a4322}.f:focus-visible{outline:3px solid #1677c850}
.f .ph{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#102a43,#1677c8);display:grid;place-items:center;color:#ffffffb0;font-weight:800;font-size:15px}
.f .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.f .n{position:absolute;right:10px;bottom:10px;background:#102a43cc;color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.f .bd{padding:12px 14px 16px}
.f b{display:block;color:var(--navy);line-height:1.3}
.f .k{margin-top:3px;font-size:13px;color:var(--blue);font-weight:700}
.f .m{margin-top:6px;font-size:13px;color:var(--mute);line-height:1.45}
.empty{text-align:center;color:var(--mute);padding:36px 0;background:#fff;border:1px solid #dbe8f2;border-radius:18px;margin-top:14px}
dialog{border:0;border-radius:18px;padding:0;width:min(720px,calc(100% - 24px));max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);overflow-y:auto;box-shadow:0 20px 60px #102a4350}
dialog::backdrop{background:#102a4380}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:18px 20px 0}
.dh h3{margin:0;color:var(--navy);font-size:21px;line-height:1.25}
.x{border:0;background:var(--soft);color:var(--navy);font-size:22px;line-height:1;width:36px;height:36px;border-radius:50%;cursor:pointer;flex:none}
.big{margin:14px 20px 0;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#e6eef6}
.big img{width:100%;height:100%;object-fit:cover;display:block}
.th{display:flex;gap:8px;margin:10px 20px 0;overflow-x:auto;padding-bottom:4px}
.th button{flex:none;width:72px;height:54px;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;cursor:pointer;background:none}
.th button.on{border-color:var(--blue)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.db{padding:14px 20px 20px}
.info{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.info span{background:var(--soft);color:var(--navy);font-size:13px;font-weight:700;border-radius:99px;padding:4px 11px}
.desc{white-space:pre-wrap;line-height:1.65}
.emb .wrap{padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fasilitas Sekolah</h1>
  <div class="mut">Sarana dan prasarana yang mendukung belajar anak-anak di SDS Islam At-Taqwa Rawamangun</div>
  <div class="bar"><input id="q" type="search" placeholder="Cari fasilitas…" aria-label="Cari fasilitas"></div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</div>
<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h3 id="dt"></h3><button class="x" id="tutup" aria-label="Tutup">×</button></div>
  <div id="dbody"></div>
</dialog>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if (self !== top) document.body.classList.add('emb');
const urlOk = u => /^https:\/\/[^\s"'<>]+$/i.test(u || '');
let DATA = [], kat = 'semua';

function renderChips() {
  const ks = [...new Set(DATA.map(x => x.kategori).filter(Boolean))];
  $('#chips').innerHTML = ks.length > 1 ? ['semua', ...ks].map(k => `<button data-k="${esc(k)}" class="${k === kat ? 'on' : ''}">${k === 'semua' ? 'Semua' : esc(k)}</button>`).join('') : '';
  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => { kat = b.dataset.k; renderChips(); render(); });
}
function kartu(x, i) {
  const fs = (x.foto || []).filter(urlOk);
  const meta = [x.lokasi, x.kapasitas, x.jumlah != null ? x.jumlah + ' unit' : ''].filter(Boolean).join(' · ');
  return `<button class="f" data-i="${i}"><div class="ph">${fs[0] ? `<img src="${esc(fs[0])}" alt="${esc(x.nama)}" loading="lazy">` : 'Foto belum tersedia'}${fs.length > 1 ? `<span class="n">${fs.length} foto</span>` : ''}</div>
    <div class="bd"><b>${esc(x.nama)}</b><div class="k">${esc(x.kategori)}</div>${meta ? `<div class="m">${esc(meta)}</div>` : ''}</div></button>`;
}
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const rows = DATA.filter(x => (kat === 'semua' || x.kategori === kat) && (!q || [x.nama, x.kategori, x.lokasi, x.deskripsi].join(' ').toLowerCase().includes(q)));
  if (!rows.length) { $('#list').innerHTML = `<div class="empty">${DATA.length ? 'Tidak ada yang cocok.' : 'Data fasilitas belum tersedia.'}</div>`; return; }
  $('#list').innerHTML = `<div class="grid">${rows.map(x => kartu(x, DATA.indexOf(x))).join('')}</div>`;
}
function buka(x) {
  const fs = (x.foto || []).filter(urlOk);
  const info = [x.kategori, x.lokasi, x.kapasitas && 'Kapasitas ' + x.kapasitas, x.jumlah != null && x.jumlah + ' unit'].filter(Boolean);
  $('#dt').textContent = x.nama;
  $('#dbody').innerHTML = `${fs.length ? `<div class="big"><img id="bigimg" src="${esc(fs[0])}" alt="${esc(x.nama)}"></div>` : ''}
    ${fs.length > 1 ? `<div class="th">${fs.map((u, i) => `<button data-u="${esc(u)}" class="${i ? '' : 'on'}" aria-label="Foto ${i + 1}"><img src="${esc(u)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}
    <div class="db"><div class="info">${info.map(t => `<span>${esc(t)}</span>`).join('')}</div>${x.deskripsi ? `<div class="desc">${esc(x.deskripsi)}</div>` : ''}</div>`;
  $('#dbody').onclick = e => {
    const b = e.target.closest('[data-u]'); if (!b) return;
    $('#bigimg').src = b.dataset.u; document.querySelectorAll('.th button').forEach(t => t.classList.toggle('on', t === b));
  };
  $('#dlg').showModal();
}
$('#list').onclick = e => { const b = e.target.closest('[data-i]'); if (b) buka(DATA[Number(b.dataset.i)]); };
$('#tutup').onclick = () => $('#dlg').close();
$('#dlg').addEventListener('click', e => { if (e.target === $('#dlg')) $('#dlg').close(); });
$('#q').oninput = render;
$('#list').innerHTML = '<div class="empty">Memuat…</div>';
fetch('/api/fasilitas').then(r => r.json()).then(d => { if (d.error) throw new Error(d.error); DATA = d.fasilitas || []; })
  .catch(() => { DATA = []; }).then(() => { renderChips(); render(); });
</script>
<script src="data-sekolah.js"></script>
<script src="footer-sekolah.js"></script>
</body>
</html>
