<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kegiatan Sekolah (Panitia)</title>
<link rel="icon" href="logo-at-taqwa.png">
<style>
:root{--navy:#102a43;--blue:#1677c8;--soft:#eef6fc;--ink:#243b53;--line:#cbd8e6;--ok:#19724d;--danger:#bc3d33;--mute:#627d98}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#edf7ff,#f8fbfe 48%,#e6f1fb)}
.wrap{width:min(1000px,calc(100% - 24px));margin:0 auto;padding:24px 0 48px}
.hidden{display:none!important}
h1{margin:0;color:var(--navy);font-size:clamp(22px,4.5vw,28px);letter-spacing:-.03em}
h2,h3{margin:0;color:var(--navy)}h3{font-size:17px}
.mut{color:var(--mute);font-size:13px}
.card{background:#fff;border:1px solid #dbe8f2;border-radius:18px;padding:clamp(14px,3.5vw,22px);box-shadow:0 12px 30px #102a4310;margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button,.btn{border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;background:var(--blue);color:#fff}
button.sec{background:#fff;color:var(--navy);border:1px solid var(--line)}
button.bad{background:var(--danger)}button.good{background:var(--ok)}
button.sm{padding:6px 11px;font-size:13px}
button:disabled{opacity:.6;cursor:wait}
label{display:block;font-weight:700;color:var(--navy);margin:0 0 5px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);font:inherit;color:var(--ink);background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px #1677c820}
.err{margin-top:10px;color:var(--danger);font-weight:650}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f6;color:var(--mute)}
.pill.ok{background:#eaf5ee;color:var(--ok)}.pill.warn{background:#fdf0e3;color:#a65f00}.pill.bad{background:#fbeceb;color:var(--danger)}.pill.blue{background:#e3f0fb;color:var(--blue)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--soft);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--navy)}.stats span{font-size:12px;color:var(--mute)}
.klist{display:grid;gap:10px;margin-top:12px}
.k{border:1px solid #dbe8f2;border-radius:14px;padding:14px;background:#fff}.k.sel{border-color:var(--blue);box-shadow:0 0 0 3px #1677c820}
.k .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}.tabs button{background:#fff;color:var(--navy);border:1px solid var(--line)}.tabs button.on{background:var(--navy);color:#fff}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid #e6eef5;text-align:left;vertical-align:top}th{color:var(--mute);font-size:12px;text-transform:uppercase}
dialog{border:0;border-radius:18px;padding:20px;width:min(560px,calc(100% - 24px));box-shadow:0 20px 60px #102a4350}dialog::backdrop{background:#102a4380}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .full{grid-column:1/-1}
.bukti{max-width:100%;max-height:52vh;display:block;margin:10px auto;border-radius:12px;border:1px solid var(--line)}
.emb .wrap{padding-top:12px}
@media(max-width:560px){.grid2,.filters{grid-template-columns:1fr}}
@media print{.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div class="wrap">

<div id="login" class="card" style="max-width:420px;margin:8vh auto 0;text-align:center">
  <img src="logo-at-taqwa.png" alt="" width="64" height="64" style="background:#fff;border-radius:16px;padding:6px;box-shadow:0 8px 20px #102a4325">
  <h1 style="margin-top:10px">Kegiatan Sekolah</h1>
  <p class="mut">Khusus panitia. Masukkan PIN admin.</p>
  <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN admin" style="text-align:center;font-size:18px">
  <p style="margin:12px 0 0"><button id="masuk">Masuk</button></p>
  <div id="loginErr" class="err"></div>
</div>

<div id="app" class="hidden">
  <div class="top noprint">
    <div><h1>Kegiatan Sekolah</h1><div class="mut">Pendaftaran dan bukti transfer orang tua</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sec" id="muat">Muat ulang</button><button class="sec" id="keluar">Keluar</button></div>
  </div>

  <div class="card noprint">
    <div class="top"><h2>Daftar kegiatan</h2><button id="tambah">+ Tambah kegiatan</button></div>
    <div id="klist" class="klist"></div>
  </div>

  <div id="detail" class="card hidden"></div>
</div>
</div>

<dialog id="dlgK">
  <form id="fK" method="dialog" style="margin:0">
    <h2 id="dlgKt" style="margin-bottom:12px">Kegiatan</h2>
    <div class="grid2">
      <div class="full"><label>Nama kegiatan</label><input name="nama" maxlength="100" required placeholder="mis. Perkemahan Sabtu-Minggu"></div>
      <div class="full"><label>Deskripsi / info untuk orang tua</label><textarea name="deskripsi" rows="3" maxlength="1000" placeholder="Tempat, jam kumpul, barang bawaan…"></textarea></div>
      <div><label>Biaya (Rp)</label><input name="biaya" type="number" min="0" step="1000" required value="0"></div>
      <div><label>Kuota (kosongkan jika tidak dibatasi)</label><input name="kuota" type="number" min="1"></div>
      <div class="full"><label>Rekening tujuan transfer</label><textarea name="rekening" rows="2" maxlength="300" placeholder="Bank … 1234567890 a.n. …"></textarea></div>
      <div><label>Pendaftaran dibuka</label><input name="buka_daftar" type="date" required></div>
      <div><label>Pendaftaran ditutup</label><input name="tutup_daftar" type="date" required></div>
      <div class="full"><label>Tanggal kegiatan (setelah ini kartu hilang dari halaman orang tua)</label><input name="tanggal_kegiatan" type="date" required></div>
    </div>
    <div id="errK" class="err"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button type="button" class="sec" id="batalK">Batal</button><button type="submit" id="simpanK">Simpan</button></div>
  </form>
</dialog>

<dialog id="dlgP">
  <div id="pBody"></div>
</dialog>

<script>
const TOKEN_KEY = 'bukuTamuSekolah.adminToken';   // sama dengan panel Buku Tamu: sekali login berlaku untuk keduanya
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const tgl = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
const FASE = { akan: ['Akan datang', 'blue'], dibuka: ['Dibuka', 'ok'], penuh: ['Kuota penuh', 'warn'], ditutup: ['Ditutup', ''], selesai: ['Selesai', ''] };
const ST = { menunggu: ['Menunggu', 'warn'], lunas: ['Lunas', 'ok'], ditolak: ['Ditolak', 'bad'] };
if (self !== top) document.body.classList.add('emb');

let D = { kegiatan: [], pendaftar: [], murid: [], today: '' }, sel = null, tab = 'daftar', editId = null;

async function api(body) {
  const r = await fetch('/api/admin-kegiatan', body ? { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + sessionStorage.getItem(TOKEN_KEY) }, body: JSON.stringify(body) }
    : { headers: { Authorization: 'Bearer ' + sessionStorage.getItem(TOKEN_KEY) } });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401) { sessionStorage.removeItem(TOKEN_KEY); showLogin(); throw new Error(d.error || 'Sesi berakhir.'); }
  if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status);
  return d;
}
function showLogin() { $('#app').classList.add('hidden'); $('#login').classList.remove('hidden'); }
async function masuk() {
  $('#loginErr').textContent = ''; $('#masuk').disabled = true;
  try {
    const r = await fetch('/api/admin-auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: $('#pin').value }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.token) { $('#loginErr').textContent = d.error || 'Login gagal.'; return; }
    sessionStorage.setItem(TOKEN_KEY, d.token); $('#pin').value = ''; await mulai();
  } catch (e) { $('#loginErr').textContent = 'Tidak bisa terhubung.'; } finally { $('#masuk').disabled = false; }
}
async function mulai() {
  if (!sessionStorage.getItem(TOKEN_KEY)) return showLogin();
  try { await muat(); $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); } catch (e) { if (!$('#login').classList.contains('hidden')) $('#loginErr').textContent = e.message; }
}
async function muat() { D = await api(); if (sel && !D.kegiatan.find(k => k.id === sel)) sel = null; renderList(); renderDetail(); }

const stat = id => { const p = D.pendaftar.filter(x => x.kegiatan_id === id), n = s => p.filter(x => x.status === s).length; return { total: p.length, menunggu: n('menunggu'), lunas: n('lunas'), ditolak: n('ditolak') }; };

function renderList() {
  $('#klist').innerHTML = D.kegiatan.length ? D.kegiatan.map(k => {
    const s = stat(k.id), f = FASE[k.fase];
    return `<div class="k ${k.id === sel ? 'sel' : ''}"><div class="top"><div><h3>${esc(k.nama)}</h3><div class="mut">Kegiatan ${tgl(k.tanggal_kegiatan)} · Daftar ${tgl(k.buka_daftar)} – ${tgl(k.tutup_daftar)} · ${k.biaya ? rp(k.biaya) : 'Gratis'}${k.kuota ? ' · Kuota ' + k.kuota : ''}</div></div><span class="pill ${f[1]}">${f[0]}</span></div>
    <div class="mut" style="margin-top:6px">${s.total} pendaftar · ${s.lunas} lunas · ${s.menunggu} menunggu</div>
    <div class="acts"><button class="sm" data-a="buka" data-id="${k.id}">Kelola pendaftar</button><button class="sm sec" data-a="edit" data-id="${k.id}">Edit</button><button class="sm sec" data-a="dup" data-id="${k.id}">Duplikat</button>
    ${k.fase !== 'selesai' ? `<button class="sm sec" data-a="aktif" data-id="${k.id}" data-v="${!k.aktif}">${k.aktif ? 'Tutup pendaftaran' : 'Buka pendaftaran'}</button>` : ''}
    <button class="sm sec" data-a="hapus" data-id="${k.id}">Hapus</button></div></div>`;
  }).join('') : '<p class="mut">Belum ada kegiatan. Klik "Tambah kegiatan".</p>';
}
$('#klist').onclick = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const k = D.kegiatan.find(x => x.id === b.dataset.id), a = b.dataset.a;
  try {
    if (a === 'buka') { sel = k.id; tab = 'daftar'; renderList(); renderDetail(); $('#detail').scrollIntoView({ behavior: 'smooth' }); }
    else if (a === 'edit') formK(k);
    else if (a === 'dup') formK({ ...k, id: null, nama: k.nama + ' (salinan)', buka_daftar: '', tutup_daftar: '', tanggal_kegiatan: '' });
    else if (a === 'aktif') { await api({ action: 'aktif', id: k.id, aktif: b.dataset.v === 'true' }); await muat(); }
    else if (a === 'hapus' && confirm(`Hapus kegiatan "${k.nama}"? Hanya bisa jika belum ada pendaftar.`)) { await api({ action: 'hapus', id: k.id }); await muat(); }
  } catch (err) { alert(err.message); }
};

/* ---- Formulir kegiatan ---- */
function formK(k) {
  const f = $('#fK'); editId = k && k.id; $('#errK').textContent = '';
  $('#dlgKt').textContent = editId ? 'Edit kegiatan' : 'Tambah kegiatan';
  const v = k || { biaya: 0, buka_daftar: D.today };
  ['nama', 'deskripsi', 'biaya', 'kuota', 'rekening', 'buka_daftar', 'tutup_daftar', 'tanggal_kegiatan'].forEach(n => f[n].value = v[n] ?? '');
  $('#dlgK').showModal();
}
$('#tambah').onclick = () => formK(null);
$('#batalK').onclick = () => $('#dlgK').close();
$('#fK').onsubmit = async e => {
  e.preventDefault(); const f = e.target, b = $('#simpanK'); b.disabled = true; $('#errK').textContent = '';
  try {
    await api({ action: 'simpan', id: editId, nama: f.nama.value, deskripsi: f.deskripsi.value, biaya: Number(f.biaya.value), kuota: f.kuota.value === '' ? null : Number(f.kuota.value),
      rekening: f.rekening.value, buka_daftar: f.buka_daftar.value, tutup_daftar: f.tutup_daftar.value, tanggal_kegiatan: f.tanggal_kegiatan.value });
    $('#dlgK').close(); await muat();
  } catch (err) { $('#errK').textContent = err.message; } finally { b.disabled = false; }
};

/* ---- Detail pendaftar ---- */
function renderDetail() {
  const box = $('#detail'), k = D.kegiatan.find(x => x.id === sel);
  if (!k) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  const s = stat(k.id), ps = D.pendaftar.filter(x => x.kegiatan_id === k.id);
  const ada = new Set(ps.map(x => x.anak_key)), belum = D.murid.filter(m => !ada.has(m.key)).sort((a, b) => (a.kelas + a.nama).localeCompare(b.kelas + b.nama, 'id', { numeric: true }));
  const kelasOpt = [...new Set(ps.map(x => x.kelas).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'id', { numeric: true }));
  box.innerHTML = `<div class="top"><div><h2>${esc(k.nama)}</h2><div class="mut">Kegiatan ${tgl(k.tanggal_kegiatan)} · ${k.biaya ? rp(k.biaya) : 'Gratis'}</div></div>
    <div class="noprint" style="display:flex;gap:8px"><button class="sec sm" id="csv">Ekspor CSV</button><button class="sec sm" id="cetak">Cetak</button></div></div>
    <div class="stats"><div><b>${s.total}</b><span>Pendaftar</span></div><div><b>${s.lunas}</b><span>Lunas</span></div><div><b>${s.menunggu}</b><span>Menunggu</span></div><div><b>${s.ditolak}</b><span>Ditolak</span></div>
    <div><b>${rp(s.lunas * k.biaya)}</b><span>Dana terkonfirmasi</span></div>${k.kuota ? `<div><b>${Math.max(0, k.kuota - k.terpakai)}</b><span>Sisa kuota</span></div>` : ''}</div>
    <div class="tabs noprint"><button data-t="daftar" class="${tab === 'daftar' ? 'on' : ''}">Pendaftar (${s.total})</button><button data-t="belum" class="${tab === 'belum' ? 'on' : ''}">Belum daftar (${belum.length})</button></div>
    <div id="isi"></div>`;
  box.querySelector('.tabs').onclick = e => { const b = e.target.closest('[data-t]'); if (b) { tab = b.dataset.t; renderDetail(); } };
  $('#cetak').onclick = () => window.print();
  $('#csv').onclick = () => csv(k, ps);
  if (tab === 'belum') {
    $('#isi').innerHTML = belum.length ? `<div class="scroll"><table><tr><th>Nama</th><th>Kelas</th></tr>${belum.map(m => `<tr><td>${esc(m.nama)}</td><td>${esc(m.kelas)}</td></tr>`).join('')}</table></div>` : '<p class="mut">Semua murid sudah mendaftar.</p>';
    return;
  }
  $('#isi').innerHTML = `<div class="filters noprint"><div><label>Status</label><select id="fs"><option value="">Semua</option><option value="menunggu">Menunggu</option><option value="lunas">Lunas</option><option value="ditolak">Ditolak</option></select></div>
    <div><label>Kelas</label><select id="fk"><option value="">Semua</option>${kelasOpt.map(x => `<option>${esc(x)}</option>`).join('')}</select></div></div>
    <input id="fq" class="noprint" placeholder="Cari nama anak…" style="margin-bottom:10px"><div id="tbl"></div>`;
  const draw = () => {
    const q = $('#fq').value.trim().toLowerCase(), fs = $('#fs').value, fk = $('#fk').value;
    const rows = ps.filter(x => (!fs || x.status === fs) && (!fk || x.kelas === fk) && (!q || x.nama_anak.toLowerCase().includes(q)));
    $('#tbl').innerHTML = rows.length ? `<div class="scroll"><table><tr><th>Anak</th><th>Status</th><th>Transfer</th><th>Kaos</th><th>Kesehatan</th><th>Kontak darurat</th><th class="noprint"></th></tr>
      ${rows.map(x => `<tr><td><b>${esc(x.nama_anak)}</b><div class="mut">${esc(x.kelas)}</div></td><td><span class="pill ${ST[x.status][1]}">${ST[x.status][0]}</span>${x.catatan_panitia ? `<div class="mut">${esc(x.catatan_panitia)}</div>` : ''}</td>
      <td>${esc(x.nama_pengirim)}<div class="mut">${tgl(x.tanggal_transfer)}</div></td><td>${esc(x.data.kaos || '-')}</td><td>${esc(x.data.kesehatan || '-')}</td><td>${esc(x.data.kontak || '-')}</td>
      <td class="noprint"><button class="sm ${x.status === 'menunggu' ? '' : 'sec'}" data-p="${x.id}">${x.status === 'menunggu' ? 'Periksa' : 'Lihat'}</button></td></tr>`).join('')}</table></div>` : '<p class="mut">Tidak ada data.</p>';
  };
  ['#fq', '#fs', '#fk'].forEach(q => $(q).oninput = draw); draw();
  $('#tbl').onclick = e => { const b = e.target.closest('[data-p]'); if (b) periksa(ps.find(x => x.id === b.dataset.p), k); };
}

async function periksa(p, k) {
  const dlg = $('#dlgP'), body = $('#pBody');
  body.innerHTML = `<h2>${esc(p.nama_anak)}</h2><div class="mut">${esc(p.kelas)} · ${esc(k.nama)}</div>
    <p style="margin:10px 0 0">Pengirim: <b>${esc(p.nama_pengirim)}</b> · ${tgl(p.tanggal_transfer)}<br>Nominal seharusnya: <b>${rp(k.biaya)}</b></p><div id="bk" class="mut" style="margin:10px 0">Memuat bukti…</div>
    <label>Catatan untuk orang tua (wajib jika ditolak)</label><textarea id="cat" rows="2" maxlength="300" placeholder="mis. Nominal kurang Rp50.000 / foto buram, mohon kirim ulang">${esc(p.catatan_panitia || '')}</textarea><div id="perr" class="err"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px"><button class="sec" data-s="x">Tutup</button>
    ${p.status !== 'menunggu' ? '<button class="sec" data-s="menunggu">Kembalikan ke menunggu</button>' : ''}<button class="bad" data-s="ditolak">Tolak</button><button class="good" data-s="lunas">Tandai lunas</button></div>`;
  dlg.showModal();
  api({ action: 'bukti', id: p.id }).then(d => { $('#bk').innerHTML = `<a href="${esc(d.url)}" target="_blank" rel="noopener"><img class="bukti" src="${esc(d.url)}" alt="Bukti transfer"></a>`; }).catch(e => { $('#bk').textContent = 'Bukti tidak dapat dimuat: ' + e.message; });
  body.onclick = async e => {
    const b = e.target.closest('[data-s]'); if (!b) return;
    if (b.dataset.s === 'x') return dlg.close();
    b.disabled = true; $('#perr').textContent = '';
    try { await api({ action: 'verifikasi', id: p.id, status: b.dataset.s, catatan: $('#cat').value }); dlg.close(); await muat(); }
    catch (err) { $('#perr').textContent = err.message; b.disabled = false; }
  };
}

function csv(k, ps) {
  const c = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['Nama', 'Kelas', 'Status', 'Pengirim', 'Tanggal transfer', 'Ukuran kaos', 'Kesehatan', 'Kontak darurat', 'Catatan panitia', 'Waktu daftar'],
    ...ps.map(x => [x.nama_anak, x.kelas, x.status, x.nama_pengirim, x.tanggal_transfer, x.data.kaos, x.data.kesehatan, x.data.kontak, x.catatan_panitia, x.created_at])];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + rows.map(r => r.map(c).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'pendaftar-' + k.nama.replace(/[^\w]+/g, '-').toLowerCase() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
}

$('#masuk').onclick = masuk; $('#pin').onkeydown = e => { if (e.key === 'Enter') masuk(); };
$('#muat').onclick = () => muat().catch(e => alert(e.message));
$('#keluar').onclick = () => { sessionStorage.removeItem(TOKEN_KEY); showLogin(); };
mulai();
</script>
</body>
</html>
